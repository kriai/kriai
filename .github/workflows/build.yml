name: Build profile

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths: [profile.json, scripts/**, README.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate SVGs and README sections
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional fine-grained PAT with read access to all your repos (metadata only).
          # Without it, stats stay as last generated and only public repos are listed.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python3 scripts/build.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets
          git diff --cached --quiet || { git commit -m "Refresh profile"; git push; }
