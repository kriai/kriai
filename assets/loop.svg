<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="How I work: Signal, Bet, Prototype, Learn, repeat.">
  <title>Signal → Bet → Prototype → Learn</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0d16"/><stop offset="1" stop-color="#11132a"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.6"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  </defs>
  <style>.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }</style>
  <rect width="1200" height="270" rx="28" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="269" rx="28" fill="none" stroke="#fff" stroke-opacity="0.08"/>
  <path d="M150,150 H1050 A35,35 0 0 1 1050,220 H150 A35,35 0 0 1 150,150" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="2"/>
  <path d="M150,150 H1050 A35,35 0 0 1 1050,220 H150 A35,35 0 0 1 150,150" fill="none" stroke="url(#trail)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="140 1880">
    <animate attributeName="stroke-dashoffset" from="140" to="-1880" dur="9s" repeatCount="indefinite"/></path>
  <circle r="14" fill="url(#halo)"><animateMotion dur="9s" repeatCount="indefinite" path="M150,150 H1050 A35,35 0 0 1 1050,220 H150 A35,35 0 0 1 150,150"/></circle>
  <circle r="4.5" fill="#fff"><animateMotion dur="9s" repeatCount="indefinite" path="M150,150 H1050 A35,35 0 0 1 1050,220 H150 A35,35 0 0 1 150,150"/></circle>
    <circle cx="150" cy="150" r="26" fill="url(#halo)" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.000;0.000;0.120;1" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="150" r="9" fill="#11132a" stroke="#a78bfa" stroke-width="2.5"/>
    <circle cx="150" cy="150" r="4" fill="#a78bfa"><animate attributeName="fill" values="#a78bfa;#a78bfa;#fff;#a78bfa;#a78bfa" keyTimes="0;0.000;0.000;0.120;1" dur="9s" repeatCount="indefinite"/></circle>
    <text x="150" y="54" text-anchor="middle" class="mono" font-size="12" letter-spacing="2" fill="#6b7280">01</text>
    <text x="150" y="82" text-anchor="middle" class="sans" font-size="22" font-weight="700" fill="#f3f4f6">Signal
      <animate attributeName="fill" values="#f3f4f6;#f3f4f6;#67e8f9;#f3f4f6;#f3f4f6" keyTimes="0;0.000;0.000;0.120;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="150" y="108" text-anchor="middle" class="sans" font-size="15" fill="#9ca3af">spot the shift</text>
    <circle cx="450" cy="150" r="26" fill="url(#halo)" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.139;0.149;0.269;1" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="150" r="9" fill="#11132a" stroke="#a78bfa" stroke-width="2.5"/>
    <circle cx="450" cy="150" r="4" fill="#a78bfa"><animate attributeName="fill" values="#a78bfa;#a78bfa;#fff;#a78bfa;#a78bfa" keyTimes="0;0.139;0.149;0.269;1" dur="9s" repeatCount="indefinite"/></circle>
    <text x="450" y="54" text-anchor="middle" class="mono" font-size="12" letter-spacing="2" fill="#6b7280">02</text>
    <text x="450" y="82" text-anchor="middle" class="sans" font-size="22" font-weight="700" fill="#f3f4f6">Bet
      <animate attributeName="fill" values="#f3f4f6;#f3f4f6;#67e8f9;#f3f4f6;#f3f4f6" keyTimes="0;0.139;0.149;0.269;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="450" y="108" text-anchor="middle" class="sans" font-size="15" fill="#9ca3af">frame the hypothesis</text>
    <circle cx="750" cy="150" r="26" fill="url(#halo)" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.287;0.297;0.417;1" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="150" r="9" fill="#11132a" stroke="#a78bfa" stroke-width="2.5"/>
    <circle cx="750" cy="150" r="4" fill="#a78bfa"><animate attributeName="fill" values="#a78bfa;#a78bfa;#fff;#a78bfa;#a78bfa" keyTimes="0;0.287;0.297;0.417;1" dur="9s" repeatCount="indefinite"/></circle>
    <text x="750" y="54" text-anchor="middle" class="mono" font-size="12" letter-spacing="2" fill="#6b7280">03</text>
    <text x="750" y="82" text-anchor="middle" class="sans" font-size="22" font-weight="700" fill="#f3f4f6">Prototype
      <animate attributeName="fill" values="#f3f4f6;#f3f4f6;#67e8f9;#f3f4f6;#f3f4f6" keyTimes="0;0.287;0.297;0.417;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="750" y="108" text-anchor="middle" class="sans" font-size="15" fill="#9ca3af">ship it in days</text>
    <circle cx="1050" cy="150" r="26" fill="url(#halo)" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.436;0.446;0.566;1" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="150" r="9" fill="#11132a" stroke="#a78bfa" stroke-width="2.5"/>
    <circle cx="1050" cy="150" r="4" fill="#a78bfa"><animate attributeName="fill" values="#a78bfa;#a78bfa;#fff;#a78bfa;#a78bfa" keyTimes="0;0.436;0.446;0.566;1" dur="9s" repeatCount="indefinite"/></circle>
    <text x="1050" y="54" text-anchor="middle" class="mono" font-size="12" letter-spacing="2" fill="#6b7280">04</text>
    <text x="1050" y="82" text-anchor="middle" class="sans" font-size="22" font-weight="700" fill="#f3f4f6">Learn
      <animate attributeName="fill" values="#f3f4f6;#f3f4f6;#67e8f9;#f3f4f6;#f3f4f6" keyTimes="0;0.436;0.446;0.566;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="1050" y="108" text-anchor="middle" class="sans" font-size="15" fill="#9ca3af">measure, then decide</text>
  <rect x="540" y="206" width="120" height="28" rx="14" fill="#11132a" stroke="#fff" stroke-opacity="0.1"/>
  <text x="600" y="225" text-anchor="middle" class="mono" font-size="13" fill="#9ca3af">↺ repeat</text>
</svg>
