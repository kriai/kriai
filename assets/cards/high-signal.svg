<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-label="High Signal: A dashboard that scrapes my sources every 30 minutes and keeps only what matters.">
  <title>High Signal</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0d16"/><stop offset="1" stop-color="#121628"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="0.25" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0.08"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0.9"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 300 160;360 300 160" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0.55"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0.45"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <clipPath id="frame"><rect width="600" height="320" rx="22"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .nudge { animation: nudge 1.8s ease-in-out infinite; }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="600" height="320" fill="url(#bg)"/>
    <circle cx="500" cy="120" r="200" fill="url(#halo)"><animate attributeName="r" values="180;220;180" dur="6s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="1" y="1" width="598" height="318" rx="21" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <rect x="36" y="34" width="72" height="30" rx="15" fill="#4ade80" fill-opacity="0.1" stroke="#4ade80" stroke-opacity="0.35"/>
  <circle cx="52" cy="49" r="4.5" fill="#4ade80"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="64" y="54" class="mono" font-size="12" letter-spacing="1.5" fill="#4ade80">LIVE</text>
  <text x="36" y="118" class="sans" font-size="32" font-weight="800" letter-spacing="-1" fill="url(#title)">High Signal</text>
  <text x="36" y="156" class="sans" font-size="17" fill="#9ca3af"><tspan x="36" dy="0">A dashboard that scrapes my</tspan><tspan x="36" dy="25">sources every 30 minutes and keeps</tspan><tspan x="36" dy="25">only what matters.</tspan></text>
  <rect x="36" y="258" width="66" height="26" rx="13" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/><text x="69" y="275.5" text-anchor="middle" class="mono" font-size="12" fill="#cbd5e1">Python</text><rect x="109.8" y="258" width="117" height="26" rx="13" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/><text x="168" y="275.5" text-anchor="middle" class="mono" font-size="12" fill="#cbd5e1">Cloudflare D1</text><rect x="234.7" y="258" width="73" height="26" rx="13" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/><text x="271" y="275.5" text-anchor="middle" class="mono" font-size="12" fill="#cbd5e1">Actions</text>
  <g transform="translate(372 46)">
      <circle cx="100" cy="85" r="26" stroke="#fff" stroke-opacity="0.14" fill="none"/><circle cx="100" cy="85" r="52" stroke="#fff" stroke-opacity="0.14" fill="none"/><circle cx="100" cy="85" r="78" stroke="#fff" stroke-opacity="0.14" fill="none"/>
      <path d="M22 85H178M100 7V163" stroke="#fff" stroke-opacity="0.14" fill="none"/>
      <g><path d="M100 85L100 7A78 78 0 0 1 167.5 46Z" fill="url(#sweep)"/>
        <animateTransform attributeName="transform" type="rotate" from="0 100 85" to="360 100 85" dur="4s" repeatCount="indefinite"/></g>
      <circle cx="123" cy="40" r="4" fill="#22d3ee" opacity="0"><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.07;0.10;1" dur="4s" repeatCount="indefinite"/></circle><circle cx="163" cy="111" r="4" fill="#22d3ee" opacity="0"><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.32;0.35;1" dur="4s" repeatCount="indefinite"/></circle><circle cx="83" cy="114" r="4" fill="#22d3ee" opacity="0"><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.58;0.61;1" dur="4s" repeatCount="indefinite"/></circle><circle cx="46" cy="58" r="4" fill="#22d3ee" opacity="0"><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.83;0.86;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="100" cy="85" r="4" fill="#fff"/></g>
  <g class="nudge"><text x="564" y="276" text-anchor="end" class="mono" font-size="13" fill="#22d3ee">open dashboard →</text></g>
</svg>
