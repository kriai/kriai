    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></linearGradient>
    <clipPath id="frame"><rect width="600" height="320" rx="22"/></clipPath>
  </defs>
