<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-label="CoA Intelligence: Claude reads legacy chart-of-accounts files, flags problems and exports to NetSuite.">
  <title>CoA Intelligence</title>
  <defs>
