<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-label="Full Page Shot: Chrome extension: capture whole pages, annotate, redact and export as PNG or PDF.">
  <title>Full Page Shot</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0d16"/><stop offset="1" stop-color="#121628"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.9"/><stop offset="0.25" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0.08"/><stop offset="1" stop-color="#a855f7" stop-opacity="0.9"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 300 160;360 300 160" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#a855f7" stop-opacity="0.35"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f472b6" stop-opacity="0"/><stop offset="1" stop-color="#f472b6" stop-opacity="0.55"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f472b6" stop-opacity="0"/><stop offset="1" stop-color="#f472b6" stop-opacity="0.45"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f472b6" stop-opacity="0.35"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></linearGradient>
    <clipPath id="frame"><rect width="600" height="320" rx="22"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .nudge { animation: nudge 1.8s ease-in-out infinite; }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="600" height="320" fill="url(#bg)"/>
    <circle cx="500" cy="120" r="200" fill="url(#halo)"><animate attributeName="r" values="180;220;180" dur="6s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="1" y="1" width="598" height="318" rx="21" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <rect x="36" y="34" width="176" height="30" rx="15" fill="#f472b6" fill-opacity="0.1" stroke="#f472b6" stroke-opacity="0.35"/>
  <circle cx="52" cy="49" r="4.5" fill="#f472b6"/>
  <text x="64" y="54" class="mono" font-size="12" letter-spacing="1.5" fill="#f472b6">CHROME WEB STORE</text>
  <text x="36" y="118" class="sans" font-size="32" font-weight="800" letter-spacing="-1" fill="url(#title)">Full Page Shot</text>
  <text x="36" y="156" class="sans" font-size="17" fill="#9ca3af"><tspan x="36" dy="0">Chrome extension: capture whole</tspan><tspan x="36" dy="25">pages, annotate, redact and export</tspan><tspan x="36" dy="25">as PNG or PDF.</tspan></text>
  <rect x="36" y="258" width="102" height="26" rx="13" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/><text x="87" y="275.5" text-anchor="middle" class="mono" font-size="12" fill="#cbd5e1">Manifest V3</text><rect x="146.3" y="258" width="95" height="26" rx="13" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/><text x="194" y="275.5" text-anchor="middle" class="mono" font-size="12" fill="#cbd5e1">JavaScript</text>
  <g transform="translate(372 46)">
      <rect x="20" y="22" width="160" height="126" rx="10" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.16"/>
      <path d="M20 40H180" stroke="#fff" stroke-opacity="0.12"/>
      <circle cx="32" cy="31" r="2.6" fill="#fff" fill-opacity="0.25"/><circle cx="42" cy="31" r="2.6" fill="#fff" fill-opacity="0.25"/><circle cx="52" cy="31" r="2.6" fill="#fff" fill-opacity="0.25"/>
      <rect x="30" y="52" width="120" height="7" rx="3.5" fill="#fff" fill-opacity="0.12"/><rect x="38" y="69" width="96" height="7" rx="3.5" fill="#fff" fill-opacity="0.12"/><rect x="38" y="86" width="132" height="7" rx="3.5" fill="#fff" fill-opacity="0.12"/><rect x="30" y="103" width="80" height="7" rx="3.5" fill="#fff" fill-opacity="0.12"/><rect x="38" y="120" width="110" height="7" rx="3.5" fill="#fff" fill-opacity="0.12"/><rect x="38" y="137" width="70" height="7" rx="3.5" fill="#fff" fill-opacity="0.12"/>
      <rect x="20" y="40" width="160" height="22" fill="url(#scan)"><animate attributeName="y" values="40;126;40" dur="3.2s" repeatCount="indefinite"/></rect>
      <g><path d="M12 30V14H28" stroke="#f472b6" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M172 14H188V30" stroke="#f472b6" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M188 140V156H172" stroke="#f472b6" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M28 156H12V140" stroke="#f472b6" stroke-width="3" fill="none" stroke-linecap="round"/><animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" repeatCount="indefinite"/></g></g>
  <g class="nudge"><text x="564" y="276" text-anchor="end" class="mono" font-size="13" fill="#f472b6">add to chrome →</text></g>
</svg>
