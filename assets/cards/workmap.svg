<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-label="Workmap: AI transformation in one flow: interview, map the workflow, rank it, measure impact.">
  <title>Workmap</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0d16"/><stop offset="1" stop-color="#121628"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.9"/><stop offset="0.25" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0.08"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0.9"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 300 160;360 300 160" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#06b6d4" stop-opacity="0.35"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0.55"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0.45"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></linearGradient>
    <clipPath id="frame"><rect width="600" height="320" rx="22"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .nudge { animation: nudge 1.8s ease-in-out infinite; }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="600" height="320" fill="url(#bg)"/>
    <circle cx="500" cy="120" r="200" fill="url(#halo)"><animate attributeName="r" values="180;220;180" dur="6s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="1" y="1" width="598" height="318" rx="21" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <rect x="36" y="34" width="150" height="30" rx="15" fill="#9ca3af" fill-opacity="0.1" stroke="#9ca3af" stroke-opacity="0.35"/>
  <circle cx="52" cy="49" r="4.5" fill="#9ca3af"/>
  <text x="64" y="54" class="mono" font-size="12" letter-spacing="1.5" fill="#9ca3af">PRIVATE BUILD</text>
  <text x="36" y="118" class="sans" font-size="32" font-weight="800" letter-spacing="-1" fill="url(#title)">Workmap</text>
  <text x="36" y="156" class="sans" font-size="17" fill="#9ca3af"><tspan x="36" dy="0">AI transformation in one flow:</tspan><tspan x="36" dy="25">interview, map the workflow, rank</tspan><tspan x="36" dy="25">it, measure impact.</tspan></text>
  <rect x="36" y="258" width="73" height="26" rx="13" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/><text x="73" y="275.5" text-anchor="middle" class="mono" font-size="12" fill="#cbd5e1">Next.js</text><rect x="117.1" y="258" width="124" height="26" rx="13" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/><text x="179" y="275.5" text-anchor="middle" class="mono" font-size="12" fill="#cbd5e1">LLM extraction</text>
  <g transform="translate(372 46)"><path d="M20,40 C65.0,40 65.0,22 110,22" stroke="#fff" stroke-opacity="0.18" fill="none"/>
<circle r="3.5" fill="#2dd4bf"><animateMotion dur="2.4s" begin="-0.00s" repeatCount="indefinite" path="M20,40 C65.0,40 65.0,22 110,22"/></circle>
<path d="M20,40 C65.0,40 65.0,110 110,110" stroke="#fff" stroke-opacity="0.18" fill="none"/>
<circle r="3.5" fill="#2dd4bf"><animateMotion dur="2.4s" begin="-0.45s" repeatCount="indefinite" path="M20,40 C65.0,40 65.0,110 110,110"/></circle>
<path d="M110,22 C148.0,22 148.0,70 186,70" stroke="#fff" stroke-opacity="0.18" fill="none"/>
<circle r="3.5" fill="#2dd4bf"><animateMotion dur="2.4s" begin="-0.90s" repeatCount="indefinite" path="M110,22 C148.0,22 148.0,70 186,70"/></circle>
<path d="M110,110 C148.0,110 148.0,70 186,70" stroke="#fff" stroke-opacity="0.18" fill="none"/>
<circle r="3.5" fill="#2dd4bf"><animateMotion dur="2.4s" begin="-1.35s" repeatCount="indefinite" path="M110,110 C148.0,110 148.0,70 186,70"/></circle>
<path d="M110,22 C110.0,22 110.0,110 110,110" stroke="#fff" stroke-opacity="0.18" fill="none"/>
<circle r="3.5" fill="#2dd4bf"><animateMotion dur="2.4s" begin="-1.80s" repeatCount="indefinite" path="M110,22 C110.0,22 110.0,110 110,110"/></circle>
<circle cx="20" cy="40" r="11" fill="#11132a" stroke="#2dd4bf" stroke-width="2"><animate attributeName="r" values="11;13;11" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle>
<text x="20" y="70" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9ca3af">interview</text>
<circle cx="110" cy="22" r="11" fill="#11132a" stroke="#2dd4bf" stroke-width="2"><animate attributeName="r" values="11;13;11" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
<text x="110" y="52" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9ca3af">workflow</text>
<circle cx="110" cy="110" r="11" fill="#11132a" stroke="#2dd4bf" stroke-width="2"><animate attributeName="r" values="11;13;11" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
<text x="110" y="140" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9ca3af">rank</text>
<circle cx="186" cy="70" r="11" fill="#11132a" stroke="#2dd4bf" stroke-width="2"><animate attributeName="r" values="11;13;11" dur="2.4s" begin="1.7999999999999998s" repeatCount="indefinite"/></circle>
<text x="186" y="100" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9ca3af">impact</text></g>
  <g class="nudge"><text x="564" y="276" text-anchor="end" class="mono" font-size="13" fill="#2dd4bf">demo on request ✉</text></g>
</svg>
