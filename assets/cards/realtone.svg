<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-label="realtone: A Claude Code skill that strips AI writing patterns, using 50 tells and a QA pass.">
  <title>realtone</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0d16"/><stop offset="1" stop-color="#121628"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.9"/><stop offset="0.25" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0.08"/><stop offset="1" stop-color="#22c55e" stop-opacity="0.9"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 300 160;360 300 160" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#a3e635"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#22c55e" stop-opacity="0.35"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a3e635" stop-opacity="0"/><stop offset="1" stop-color="#a3e635" stop-opacity="0.55"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a3e635" stop-opacity="0"/><stop offset="1" stop-color="#a3e635" stop-opacity="0.45"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a3e635" stop-opacity="0.35"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/></linearGradient>
    <clipPath id="frame"><rect width="600" height="320" rx="22"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .nudge { animation: nudge 1.8s ease-in-out infinite; }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="600" height="320" fill="url(#bg)"/>
    <circle cx="500" cy="120" r="200" fill="url(#halo)"><animate attributeName="r" values="180;220;180" dur="6s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="1" y="1" width="598" height="318" rx="21" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <rect x="36" y="34" width="133" height="30" rx="15" fill="#a3e635" fill-opacity="0.1" stroke="#a3e635" stroke-opacity="0.35"/>
  <circle cx="52" cy="49" r="4.5" fill="#a3e635"/>
  <text x="64" y="54" class="mono" font-size="12" letter-spacing="1.5" fill="#a3e635">OPEN SOURCE</text>
  <text x="36" y="118" class="sans" font-size="32" font-weight="800" letter-spacing="-1" fill="url(#title)">realtone</text>
  <text x="36" y="156" class="sans" font-size="17" fill="#9ca3af"><tspan x="36" dy="0">A Claude Code skill that strips AI</tspan><tspan x="36" dy="25">writing patterns, using 50 tells</tspan><tspan x="36" dy="25">and a QA pass.</tspan></text>
  <rect x="36" y="258" width="102" height="26" rx="13" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/><text x="87" y="275.5" text-anchor="middle" class="mono" font-size="12" fill="#cbd5e1">Claude Code</text><rect x="146.3" y="258" width="58" height="26" rx="13" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/><text x="176" y="275.5" text-anchor="middle" class="mono" font-size="12" fill="#cbd5e1">Skill</text>
  <g transform="translate(372 46)">
      <rect x="20" y="24" width="150" height="9" rx="4.5" fill="#fff" fill-opacity="0.13"/><rect x="20" y="50" width="120" height="9" rx="4.5" fill="#fff" fill-opacity="0.13"/><rect x="20" y="102" width="140" height="9" rx="4.5" fill="#fff" fill-opacity="0.13"/><rect x="20" y="128" width="96" height="9" rx="4.5" fill="#fff" fill-opacity="0.13"/>
      <rect x="20" y="76" width="164" height="9" rx="4.5" fill="#f87171" fill-opacity="0.75">
        <animate attributeName="width" values="164;164;0;0;164" keyTimes="0;0.3;0.45;0.9;1" dur="4.5s" repeatCount="indefinite"/></rect>
      <path d="M14 80.5H190" stroke="#f87171" stroke-width="2" stroke-dasharray="176" stroke-dashoffset="176">
        <animate attributeName="stroke-dashoffset" values="176;176;0;0;176" keyTimes="0;0.1;0.25;0.9;1" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.3;0.4;0.95;1" dur="4.5s" repeatCount="indefinite"/></path>
      <rect x="20" y="76" width="0" height="9" rx="4.5" fill="#a3e635">
        <animate attributeName="width" values="0;0;110;110;0" keyTimes="0;0.45;0.6;0.9;1" dur="4.5s" repeatCount="indefinite"/></rect>
      <text x="20" y="160" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a3e635" opacity="0">✓ sounds human
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.65;0.9;1" dur="4.5s" repeatCount="indefinite"/></text></g>
  <g class="nudge"><text x="564" y="276" text-anchor="end" class="mono" font-size="13" fill="#a3e635">view repo →</text></g>
